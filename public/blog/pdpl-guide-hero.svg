<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="UAE Personal Data Protection Law compliance guide">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2f0"/>
    </linearGradient>
    <radialGradient id="glowG" cx="0.78" cy="0.15" r="0.55">
      <stop offset="0" stop-color="#00843D" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#00843D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.9" cy="0.92" r="0.5">
      <stop offset="0" stop-color="#C8102E" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#C8102E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#26282e" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glowG)"/>
  <rect width="1200" height="630" fill="url(#glowR)"/>
  <rect x="0" y="0" width="1200" height="6" fill="#00843D"/>

  <!-- text block, left -->
  <text x="80" y="250" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="6" fill="#00843D">UAE DATA COMPLIANCE</text>
  <text x="76" y="345" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="104" font-weight="800" fill="#26282e">PDPL</text>
  <text x="80" y="398" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="600" fill="#545b66">The complete 2026 compliance guide</text>
  <rect x="82" y="430" width="120" height="7" rx="3.5" fill="#C8102E"/>
  <text x="80" y="560" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#545b66">Federal Decree-Law No. 45 of 2021 &#183; Personal Data Protection</text>

  <!-- node graph, right -->
  <g transform="translate(560 0)">
    <g stroke-linecap="round" fill="none">
      <path d="M320 470 L400 300 L330 150 M400 300 L560 340 L610 190 M560 340 L520 500" stroke="#26282e" stroke-opacity="0.18" stroke-width="2"/>
      <path d="M330 150 L610 190" stroke="#00843D" stroke-opacity="0.4" stroke-width="2.5"/>
      <path d="M320 470 L520 500" stroke="#C8102E" stroke-opacity="0.32" stroke-width="2.5"/>
    </g>

    <g transform="translate(400 300)">
      <g stroke="#C8102E" stroke-width="20" stroke-linecap="round" fill="none">
        <path d="M0 0 -66 -66"/>
        <path d="M0 0 66 -66"/>
        <path d="M0 0 -66 66"/>
        <path d="M0 0 66 66"/>
      </g>
      <g fill="#C8102E">
        <circle cx="-66" cy="-66" r="28"/>
        <circle cx="66" cy="-66" r="28"/>
        <circle cx="-66" cy="66" r="28"/>
        <circle cx="66" cy="66" r="28"/>
        <circle cx="0" cy="0" r="20"/>
      </g>
      <g fill="#00843D">
        <circle cx="0" cy="-98" r="19"/>
        <circle cx="0" cy="98" r="19"/>
        <circle cx="-98" cy="0" r="19"/>
        <circle cx="98" cy="0" r="19"/>
      </g>
    </g>

    <circle cx="320" cy="470" r="15" fill="#26282e" fill-opacity="0.8"/>
    <circle cx="330" cy="150" r="14" fill="#00843D"/>
    <circle cx="560" cy="340" r="17" fill="#26282e" fill-opacity="0.85"/>
    <circle cx="610" cy="190" r="15" fill="#00843D"/>
    <circle cx="520" cy="500" r="13" fill="#C8102E"/>
  </g>
</svg>
